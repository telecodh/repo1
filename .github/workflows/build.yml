# Pegar en GitHub como: .github/workflows/build.yml
# La primera vez sube el codigo al repo, compila el APK y lo publica en Releases.
name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Extraer codigo y subirlo al repo
        if: hashFiles('app/build.gradle.kts') == ''
        run: |
          base64 -d > /tmp/src.tgz <<'B64'
