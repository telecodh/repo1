            rm -f parte2.txt
            echo v4 > .codigo-version
            [ -f gradlew ] || gradle wrapper --gradle-version 8.14.3
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Captura Pantalla: codigo v4"
            git push
          else
            echo "El codigo ya esta en la version v4"
          fi
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VER}-b${{ github.run_number }}"
          APK="CapturaPantalla-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" --repo "${{ github.repository }}" --title "Captura Pantalla ${TAG}" --notes "APK listo para instalar en Android 10+."
          
