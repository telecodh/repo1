      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="CapturaPantalla-v1.0-b${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "v1.0-b${{ github.run_number }}" "$APK" \
            --repo "${{ github.repository }}" \
            --title "Captura Pantalla v1.0 (build ${{ github.run_number }})" \
            --notes "APK listo para instalar en Android 10+."
            
